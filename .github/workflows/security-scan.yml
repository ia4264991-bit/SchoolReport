# HawkScan (StackHawk DAST) against a FRESH copy of the API started on the GitHub runner —
# never production. Run it from Actions → "Security scan" → Run workflow, before releases;
# it also runs every Monday. Results go to the StackHawk dashboard (app "SchoolReport").
name: Security scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'   # Mondays 04:00 UTC

permissions:
  contents: read

concurrency:
  group: security-scan
  cancel-in-progress: false

jobs:
  hawkscan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scan
          POSTGRES_PASSWORD: scan
          POSTGRES_DB: schoolreport_scan
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scan"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_HOST: http://localhost:3001
      APP_ENV: CI
      COMMIT_SHA: ${{ github.sha }}
      BRANCH_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # jobs never push; don't leave a token on the runner

      - uses: actions/setup-node@v7
        with:
          node-version-file: schoolreport-ges-backend-fixed/.nvmrc
          cache: npm
          cache-dependency-path: schoolreport-ges-backend-fixed/package-lock.json

      - name: Install API dependencies
        working-directory: schoolreport-ges-backend-fixed
        run: npm ci

      - name: Start the API (scan copy; production middleware, raised rate limits)
        working-directory: schoolreport-ges-backend-fixed
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          nohup node gateway/src/index.js > "$RUNNER_TEMP/api.log" 2>&1 &
        env:
          DATABASE_URL: postgres://scan:scan@localhost:5432/schoolreport_scan
          PORT: '3001'
          NODE_ENV: development
          FRONTEND_URL: https://schoolreport.online
          CORS_ORIGINS: https://schoolreport.online
          # Without these the scan would mostly test the rate limiter (429s).
          AUTH_RATE_LIMIT_MAX: '1000000'
          LOGIN_IP_FAIL_LIMIT: '1000000'
          LOGIN_ACCOUNT_FAIL_LIMIT: '1000000'
          API_RATE_LIMIT_MAX: '1000000'
          LOG_LEVEL: warn

      - name: Seed one demo school (writes masked SCAN_* values)
        working-directory: schoolreport-ges-backend-fixed
        run: node scripts/scan-seed.mjs
        env:
          SCAN_API: http://127.0.0.1:3001/api

      - name: Install the HawkScan CLI
        uses: stackhawk/hawkscan-action@v3.2.0
        with:
          apiKey: ${{ secrets.HAWK_API_KEY }}
          installCLIOnly: true

      - name: Run HawkScan
        env:
          API_KEY: ${{ secrets.HAWK_API_KEY }}
          HAWK_AGENT: github-actions
        run: |
          hawk validate auth stackhawk.yml
          hawk scan --hawk-mem 6g stackhawk.yml

      - name: API log (on failure)
        if: failure()
        run: tail -n 60 "$RUNNER_TEMP/api.log" || true
