# Runs on every push to main and every pull request:
#  - backend: full API test suite against a real PostgreSQL 17, plus a dependency audit
#  - frontend: production build, plus a dependency audit
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # run the tests on any branch from Actions or gh workflow run

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: schoolreport-ges-backend-fixed
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: schoolreport_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: schoolreport-ges-backend-fixed/.nvmrc
          cache: npm
          cache-dependency-path: schoolreport-ges-backend-fixed/package-lock.json
      - run: npm ci
      - name: Fail on known high-severity vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: API tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/schoolreport_test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: schoolreport-ges-v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: schoolreport-ges-v3/.nvmrc
          cache: npm
          cache-dependency-path: schoolreport-ges-v3/package-lock.json
      - run: npm ci
      - name: Fail on known high-severity vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
